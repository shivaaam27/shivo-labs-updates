<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Beam">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141517" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.png">
<title>Shivo Labs Beam</title>
<style>
  @font-face { font-family: Sora; font-weight: 300; src: url(/fonts/Sora-Light.ttf); }
  @font-face { font-family: Sora; font-weight: 600; src: url(/fonts/Sora-SemiBold.ttf); }
  @font-face { font-family: Hanken; font-weight: 400; src: url(/fonts/HankenGrotesk-Regular.ttf); }
  @font-face { font-family: Hanken; font-weight: 600; src: url(/fonts/HankenGrotesk-SemiBold.ttf); }
  :root {
    --sage:#4F7A5A; --sage-soft:#E3ECE5;
    --bg:#F5F5F2; --panel:#FFFFFF; --text:#141517; --muted:#6B6E73; --faint:#9A9C9F;
    --line:#E0E0DB; --hover:#E4E4DF; --tile:#D6D7D2; --err:#B9483C;
    --display:Sora,-apple-system,sans-serif; --body:Hanken,-apple-system,sans-serif; --mono:ui-monospace,Menlo,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --sage-soft:#1F2C23; --bg:#141517; --panel:#1B1C1F; --text:#ECEDE9; --muted:#9A9CA1; --faint:#6E7075;
            --line:#2A2C2F; --hover:#222327; --tile:#2E3034; color-scheme:dark; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 var(--body);
         padding:max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width:520px; margin:0 auto; }
  #app { display:block; }

  /* brand bar: one slim line */
  .brand { display:flex; align-items:center; gap:11px; margin:2px 0 14px; }
  .appicon { width:36px; height:36px; border-radius:9px; box-shadow:0 0 0 1px var(--line); flex:none; }
  .word { font:600 13px/1 var(--display); letter-spacing:.16em; }
  .word span { font-weight:300; color:#7E8082; margin-left:.3em; }
  .tag { display:block; font:600 8.5px/1 var(--display); letter-spacing:.32em; color:var(--sage); margin-top:5px; }
  .live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); min-width:0; }
  .live span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:120px; }
  .dot { width:7px; height:7px; border-radius:2px; background:var(--sage); flex:none; animation:breathe 2.4s ease-in-out infinite; }
  .live.off .dot { background:var(--err); animation:none; }

  /* cards: one padding, one rhythm */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .head { display:flex; align-items:center; gap:10px; min-height:28px; margin-bottom:6px; }
  .head h2 { font:600 15px/1 var(--display); letter-spacing:-.01em; margin:0; display:flex; align-items:center; gap:8px; }
  .head h2 span { font-weight:300; color:var(--muted); }
  .count { font:600 11px/1 var(--body); background:var(--sage); color:#fff; border-radius:99px; padding:4px 7px; min-width:20px; text-align:center; }
  .count:empty { display:none; }
  .tools { margin-left:auto; display:flex; align-items:center; gap:2px; }
  .tbtn { appearance:none; border:0; background:none; color:var(--sage); font:600 13px var(--body); padding:6px 8px; border-radius:8px; display:flex; align-items:center; gap:5px; }
  .tbtn:active { background:var(--hover); }
  .tbtn svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .spin svg { animation:turn .7s linear; }
  @keyframes turn { to { transform:rotate(360deg); } }

  .btn { appearance:none; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--text);
         font:600 15px/1 var(--body); padding:14px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
         text-align:center; text-decoration:none; transition:border-color .2s, background .2s; }
  .btn svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .btn:active { background:var(--hover); border-color:var(--sage); }
  .btn.pri { background:var(--text); color:var(--bg); border-color:var(--text); }
  .btn.pri:active { filter:brightness(.92); }
  .btn.sm { padding:12px; font-size:14px; }

  /* files coming from the PC */
  .file { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--line); }
  .file:first-of-type { border-top:0; }
  .ext { width:38px; height:38px; border-radius:9px; background:var(--hover); color:var(--muted); flex:none;
         font:600 10px/1 var(--display); letter-spacing:.04em; display:grid; place-items:center; text-transform:uppercase; }
  .file.img .ext { background:var(--sage-soft); color:var(--sage); }
  .meta { flex:1; min-width:0; }
  .meta .n { font-size:14.5px; line-height:1.25; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .meta .s { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .save { appearance:none; text-decoration:none; background:var(--sage); color:#fff; font:600 13.5px/1 var(--body);
          padding:10px 16px; border-radius:99px; flex:none; }
  .save:active { filter:brightness(.9); }
  .empty { color:var(--muted); font-size:14px; padding:6px 0 4px; }

  /* send to PC */
  .more { margin-top:8px; }
  .more summary { list-style:none; cursor:pointer; color:var(--sage); font:600 14px var(--body); padding:10px 2px 2px; display:flex; align-items:center; gap:6px; }
  .more summary::-webkit-details-marker { display:none; }
  .more summary::after { content:'›'; transition:transform .2s; }
  .more[open] summary::after { transform:rotate(90deg); }
  textarea { width:100%; min-height:64px; border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin:8px 0;
             background:transparent; color:var(--text); font:15px/1.5 var(--body); resize:vertical; display:block; transition:border-color .2s; }
  textarea:focus { outline:none; border-color:color-mix(in srgb, var(--sage) 60%, var(--line)); }
  #progress:empty, #status:empty { display:none; }
  .prow { display:flex; align-items:center; gap:10px; padding:10px 0 6px; font-size:14px; }
  .prow .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .s { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; margin:0 0 4px; }
  .bar i { display:block; height:100%; width:0; background:var(--sage); transition:width .2s var(--ease); }
  #status { font-size:13.5px; color:var(--muted); margin-top:8px; }
  #status.ok { color:var(--sage); font-weight:600; }

  /* slim install strip + footer link */
  #nopair { display:none; }
  .install { display:none; align-items:center; gap:10px; font-size:13.5px; line-height:1.35; padding:10px 12px;
             border:1px solid var(--sage); background:var(--sage-soft); border-radius:12px; margin-bottom:12px; }
  .shareic { width:22px; height:22px; flex:none; fill:none; stroke:var(--sage); stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .install .x { margin-left:auto; flex:none; appearance:none; border:0; background:none; color:var(--sage); font-size:20px; line-height:1; padding:4px 6px; }
  .foot { text-align:center; font-size:13px; color:var(--muted); padding:4px 0; }
  .foot a { color:var(--sage); font-weight:600; text-decoration:none; }

  /* the loader: the sage light runs from the arrow's tails to its tip */
  .fl { width:16px; height:16px; flex:none; }
  .fl rect { fill:var(--tile); animation:travel 1.8s var(--ease) infinite; }
  .fl .p2{animation-delay:.15s}.fl .p3{animation-delay:.3s}.fl .p4{animation-delay:.45s}.fl .p5{animation-delay:.6s}.fl .p6{animation-delay:.75s}
  .fl.done rect { animation:none; fill:var(--text); } .fl.done .p6 { fill:var(--sage); }

  /* logo assemble + staggered rise */
  .mk rect { transform-box:fill-box; transform-origin:center; }
  .play .t { animation:drop .5s var(--ease) both; }
  .play .t2{animation-delay:.06s}.play .t3{animation-delay:.12s}.play .t4{animation-delay:.18s}.play .t5{animation-delay:.24s}
  .play .lit { animation:litIn .7s var(--ease) .42s both; }
  .rise { animation:rise .6s var(--ease) both; }
  @keyframes drop { from { opacity:0; transform:translateY(14px) scale(.9); } }
  @keyframes litIn { 0% { opacity:0; transform:translate(12px,-12px) scale(.7); } 70% { opacity:1; transform:translate(-1px,1px) scale(1.04); } }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } }
  @keyframes travel { 0%,40%,100% { fill:var(--tile); } 12% { fill:var(--sage); } }
  @keyframes breathe { 50% { opacity:.35; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="loader" viewBox="-8 -8 80 80"><g transform="rotate(15 32 32)"><rect class="p1" x="0" y="46" width="18" height="18" rx="4.5"/><rect class="p2" x="46" y="0" width="18" height="18" rx="4.5"/><rect class="p3" x="0" y="23" width="18" height="18" rx="4.5"/><rect class="p4" x="23" y="0" width="18" height="18" rx="4.5"/><rect class="p5" x="23" y="23" width="18" height="18" rx="4.5"/><rect class="p6" x="0" y="0" width="18" height="18" rx="4.5"/></g></symbol>
  </defs>
</svg>
<main>
  <div class="brand">
    <svg class="appicon mk play" viewBox="0 0 100 100"><rect width="100" height="100" fill="#141517"/><g transform="rotate(15 50 50)"><rect class="t t1" x="22" y="62.25" width="15.75" height="15.75" rx="3.94" fill="#F5F5F2"/><rect class="t t2" x="62.25" y="22" width="15.75" height="15.75" rx="3.94" fill="#F5F5F2"/><rect class="t t3" x="22" y="42.125" width="15.75" height="15.75" rx="3.94" fill="#F5F5F2"/><rect class="t t4" x="42.125" y="22" width="15.75" height="15.75" rx="3.94" fill="#F5F5F2"/><rect class="t t5" x="42.125" y="42.125" width="15.75" height="15.75" rx="3.94" fill="#F5F5F2"/><rect class="lit" x="22" y="22" width="15.75" height="15.75" rx="3.94" fill="#4F7A5A"/></g></svg>
    <div class="rise" style="animation-delay:.55s"><div class="word">SHIVO<span>LABS</span></div><span class="tag">BEAM</span></div>
    <div class="live rise" id="live" style="animation-delay:.94s"><i class="dot"></i><span id="pc">Connecting…</span></div>
  </div>

  <div class="card" id="nopair">
    <div class="head"><h2>Not paired</h2></div>
    <p class="empty">Open Beam on your PC → Pair iPhone, and scan the code with your Camera.</p>
  </div>

  <div class="install rise" id="install" style="animation-delay:.6s">
    <svg viewBox="0 0 24 24" class="shareic"><path d="M12 15V3m0 0L8 7m4-4 4 4M7 10H5.5a1.5 1.5 0 0 0-1.5 1.5v8A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-8a1.5 1.5 0 0 0-1.5-1.5H17"/></svg>
    <div>Tap <b>Share</b>, then <b>Add to Home Screen</b> to keep Beam on your phone.</div>
    <button class="x" id="hideInstall" aria-label="Dismiss">×</button>
  </div>

  <div id="app">
    <!-- From the PC comes first: it's what you open Beam to see -->
    <section class="card rise" style="animation-delay:.7s">
      <div class="head">
        <h2>From <span>your PC</span><i class="count" id="count"></i></h2>
        <div class="tools">
          <button class="tbtn" id="clearBtn" style="display:none">Clear</button>
          <button class="tbtn" id="refreshBtn" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9M20 4v5h-5"/></svg></button>
        </div>
      </div>
      <div id="outbox" class="empty">Loading…</div>
    </section>

    <section class="card rise" style="animation-delay:.78s">
      <div class="head"><h2>To <span>your PC</span></h2></div>
      <input type="file" id="files" multiple hidden>
      <button class="btn pri" onclick="document.getElementById('files').click()">
        <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L8 8m4-4 4 4M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>Choose photos or files</button>
      <div id="progress"></div>
      <div id="status"></div>
      <details class="more">
        <summary>Paste text or a link</summary>
        <textarea id="text" placeholder="Paste text or a link"></textarea>
        <button class="btn sm" onclick="sendText()">Send to PC clipboard</button>
      </details>
    </section>

    <p class="foot rise" style="animation-delay:.86s">Send from any app's Share menu: <a href="https://www.icloud.com/shortcuts/6d7b833ce6604d239fd92e8bc1079494">Add “Send to PC” shortcut</a></p>
  </div>
</main>

<script>
// The pairing code lives in the address (/p/<code>), so the Home Screen app,
// which has its own storage separate from Safari, opens already paired.
const fromPath = (location.pathname.match(/^\/p\/([\w-]+)/) || [])[1];
let token = fromPath || location.hash.slice(1);
if (!token) { try { token = localStorage.getItem('beamToken') || ''; } catch (e) {} }
if (token && !fromPath) location.replace('/p/' + token);
try { localStorage.setItem('beamToken', token); } catch (e) {}
document.cookie = 'beam=' + token + '; path=/; max-age=31536000; SameSite=Strict';
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let hidden = false; try { hidden = localStorage.getItem('beamHideInstall') === '1'; } catch (e) {}
if (!standalone && token && !hidden) document.getElementById('install').style.display = 'flex';
document.getElementById('hideInstall').onclick = () => {
  document.getElementById('install').style.display = 'none';
  try { localStorage.setItem('beamHideInstall', '1'); } catch (e) {}
};

const $ = id => document.getElementById(id);
const fmt = b => b > 1e9 ? (b/1e9).toFixed(1)+' GB' : b > 1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1, Math.round(b/1e3))+' KB';
const loader = () => '<svg class="fl"><use href="#loader"/></svg>';
const IMG = new Set(['jpg','jpeg','png','gif','heic','heif','webp','bmp','tif','tiff']);

// this browser's own id and kind, so the PC can send files to it alone (see beam.py, "your devices")
const KIND = /iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1) ? 'ipad'
  : /iPhone|iPod/.test(navigator.userAgent) ? 'iphone' : Math.min(screen.width, screen.height) >= 600 ? 'tablet' : 'android';
let BID = ''; try { BID = localStorage.getItem('beamId') || ''; if (!BID) { BID = 'w' + Math.random().toString(16).slice(2, 14); localStorage.setItem('beamId', BID); } } catch (e) {}
const who = p => BID ? p + (p.includes('?') ? '&' : '?') + 'bid=' + BID + '&bkind=' + KIND : p;
async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'X-Token': token }, opts.headers || {});
  return fetch(who(path), opts);
}

async function init() {
  const r = await api('/ping').catch(() => null);
  if (!r || !r.ok) {
    $('live').classList.add('off');
    $('pc').textContent = r ? 'Not paired' : 'PC not reachable';
    if (r && r.status === 401) { $('nopair').style.display = 'block'; $('app').style.display = 'none'; }
    return;
  }
  $('live').classList.remove('off');
  const j = await r.json();
  $('pc').textContent = j.pc;
  loadOutbox();
}

function upload(file) {
  return new Promise((resolve, reject) => {
    const row = document.createElement('div');
    row.innerHTML = '<div class="prow">' + loader() + '<span class="n"></span><span class="s"></span></div><div class="bar"><i></i></div>';
    row.querySelector('.n').textContent = file.name;
    $('progress').appendChild(row);
    const dot = file.name.lastIndexOf('.');
    const xhr = new XMLHttpRequest();
    xhr.open('POST', who('/upload'));
    xhr.setRequestHeader('X-Token', token);
    xhr.setRequestHeader('X-Name', encodeURIComponent(dot > 0 ? file.name.slice(0, dot) : file.name));
    xhr.setRequestHeader('X-Ext', dot > 0 ? file.name.slice(dot + 1) : 'bin');
    xhr.setRequestHeader('Content-Type', 'application/octet-stream');
    const t0 = Date.now();
    xhr.upload.onprogress = e => {
      row.querySelector('i').style.width = (100 * e.loaded / e.total) + '%';
      const secs = (Date.now() - t0) / 1000;
      if (secs > 0.3) row.querySelector('.s').textContent = fmt(e.loaded / secs) + '/s';
    };
    xhr.onload = () => {
      if (xhr.status !== 200) return reject(new Error(xhr.responseText));
      row.querySelector('.fl').classList.add('done');
      row.querySelector('.s').textContent = 'Sent';
      resolve();
    };
    xhr.onerror = () => reject(new Error('Connection lost'));
    xhr.send(file);
  });
}

$('files').onchange = async e => {
  const list = [...e.target.files];
  $('progress').innerHTML = ''; $('status').className = ''; $('status').textContent = '';
  try {
    for (const f of list) await upload(f);
    $('status').textContent = 'Sent ' + list.length + ' item' + (list.length > 1 ? 's' : '') + ' to your PC';
    $('status').className = 'ok';
  } catch (err) { $('status').textContent = err.message; }
  e.target.value = '';
};

async function sendText() {
  const t = $('text').value.trim();
  if (!t) return;
  const r = await api('/upload', { method: 'POST', headers: { 'Content-Type': 'text/plain; charset=utf-8' }, body: t });
  if (r.ok) { $('text').value = ''; $('status').textContent = 'Sent to PC clipboard'; $('status').className = 'ok'; }
}

async function loadOutbox() {
  const r = await api('/outbox').catch(() => null);
  if (!r || !r.ok) return;
  if ($('nopair').style.display === 'block') { $('nopair').style.display = 'none'; $('app').style.display = ''; init(); }
  const items = await r.json();
  const box = $('outbox');
  const sig = JSON.stringify(items);
  if (sig === box.dataset.sig) return;  // unchanged: don't redraw every poll
  box.dataset.sig = sig;
  $('count').textContent = items.length || '';
  $('clearBtn').style.display = items.length ? '' : 'none';
  if (!items.length) { box.className = 'empty'; box.textContent = 'Nothing waiting. Drag files onto Beam on your PC.'; return; }
  box.className = ''; box.innerHTML = '';
  for (const it of items) {
    const ext = (it.name.split('.').pop() || '').toLowerCase();
    const row = document.createElement('div');
    row.className = 'file' + (IMG.has(ext) ? ' img' : '');
    row.innerHTML = '<div class="ext"></div><div class="meta"><div class="n"></div><div class="s"></div></div><a class="save">Save</a>';
    row.querySelector('.ext').textContent = (it.name.includes('.') ? ext : 'file').slice(0, 4);
    row.querySelector('.n').textContent = it.name;
    row.querySelector('.s').textContent = fmt(it.size);
    row.querySelector('a').href = who('/file/' + encodeURIComponent(it.name));
    box.appendChild(row);
  }
}

$('clearBtn').onclick = async () => { await api('/clear', { method: 'POST' }); $('outbox').dataset.sig = ''; loadOutbox(); };
$('refreshBtn').onclick = e => {
  const b = e.currentTarget; b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  $('outbox').dataset.sig = ''; loadOutbox();
};

document.addEventListener('visibilitychange', () => { if (!document.hidden) loadOutbox(); });
setInterval(() => { if (!document.hidden) loadOutbox(); }, 3000);
init();
</script>
</body>
</html>
